<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Events on Tixtee</title>
<link rel="icon" type="image/png" href="/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#47034E;
    --accent-light:#f3e9f4;
    --text-main:#1a1a1a;
    --text-muted:#8c8c8c;
    --border:#eee;
    --card-bg:#ffffff;
    --page-bg:#f7f5f8;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
  body{background:var(--page-bg); color:var(--text-main); min-height:100vh;}

  /* ---------- HERO HEADER (image + title, sized like a page header) ---------- */
  .hero{
    position:relative;
    height:260px;
    width:100%;
    background:#150017 url('') center/cover no-repeat; /* swap in your own image URL here */
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .hero::before{
    content:'';
    position:absolute; inset:0;
    background:rgba(0,0,0,0.45); /* darken overlay so title stays legible over any photo */
  }
  .hero-content{
    position:relative; z-index:2;
    text-align:center;
    color:#fff;
  }
  .hero-content h1{
    font-size:clamp(2rem,5vw,3rem);
    font-weight:800;
    letter-spacing:0.35em;
    text-transform:uppercase;
  }
  .hero-back{
    position:absolute; top:20px; left:5%; z-index:3;
    color:rgba(255,255,255,0.8); text-decoration:none; font-size:13px; font-weight:600;
  }
  .hero-back:hover{ color:#fff; }

  /* ---------- WHITE CARD PANEL, overlapping hero bottom edge ---------- */
  .panel{
    max-width:760px;
    margin:-36px auto 60px;
    background:var(--card-bg);
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,0.08);
    position:relative;
    z-index:5;
    padding:28px 30px 10px;
  }
  .panel-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:18px;
  }
  .panel-head h2{ font-size:15px; font-weight:700; }

  /* ---------- EVENT LIST ---------- */
  .events-list{ display:flex; flex-direction:column; }
  .event-row{
    display:flex; align-items:flex-start; gap:16px;
    padding:20px 0;
    border-bottom:1px solid var(--border);
    text-decoration:none; color:inherit;
  }
  .event-row:last-child{ border-bottom:none; }

  .event-date{
    flex-shrink:0; width:46px; text-align:center;
  }
  .event-date .month{
    font-size:11px; font-weight:700; color:var(--accent);
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:2px;
  }
  .event-date .day{
    font-size:20px; font-weight:800; color:var(--text-main);
  }

  .event-thumb{
    flex-shrink:0; width:100px; height:68px;
    border-radius:10px; object-fit:cover; background:#eee;
  }

  .event-body{ flex:1; min-width:0; }
  .event-title{ font-size:14.5px; font-weight:700; margin-bottom:4px; }
  .event-meta{ font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .event-desc{
    font-size:12.5px; color:var(--text-muted); line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    margin-bottom:8px;
  }
  .event-link{
    font-size:11.5px; font-weight:700; color:var(--accent);
    text-transform:uppercase; letter-spacing:0.03em;
    display:inline-flex; align-items:center; gap:4px;
  }
  .event-link svg{ width:11px; height:11px; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-muted); }

  @media (max-width:600px){
    .panel{ margin:-24px 16px 40px; padding:22px 18px 6px; }
    .event-thumb{ width:76px; height:56px; }
  }
</style>
</head>
<body>

<div class="hero">
  <a href="/" class="hero-back">← Back to home</a>
  <div class="hero-content">
    <h1>Events</h1>
  </div>
</div>

<div class="panel">
  <div class="panel-head">
    <h2>Upcoming Events</h2>
  </div>

  <div class="events-list" id="eventsList">
    <div class="empty-state">Loading events…</div>
  </div>
</div>

<!-- Your footer / quote / search section goes here — handled separately -->

<script>
  const API = 'https://api.tixtee.xyz/api';

  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  function dateParts(dateStr){
    const d = new Date(dateStr);
    return { month: MONTHS[d.getMonth()], day: d.getDate() };
  }

  function imgSrc(ev){
    if(!ev.image_url) return 'https://placehold.co/200x140/1a0620/9b8fa6?text=Tixtee';
    return ev.image_url.startsWith('/uploads') ? 'https://api.tixtee.xyz' + ev.image_url : ev.image_url;
  }

  function arrowIcon(){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;
  }

  function renderRow(ev){
    const { month, day } = dateParts(ev.event_date);
    const metaParts = [];
    if(ev.venue) metaParts.push(ev.venue);
    if(ev.start_time) metaParts.push(ev.start_time);

    return `
      <a href="/e/${ev.custom_url || ev.id}" class="event-row">
        <div class="event-date">
          <div class="month">${month}</div>
          <div class="day">${day}</div>
        </div>
        <img class="event-thumb" src="${imgSrc(ev)}" alt="">
        <div class="event-body">
          <div class="event-title">${ev.title}</div>
          ${metaParts.length ? `<div class="event-meta">${metaParts.join(' • ')}</div>` : ''}
          <div class="event-desc">${ev.description || 'Details coming soon.'}</div>
          <span class="event-link">View Event Details ${arrowIcon()}</span>
        </div>
      </a>`;
  }

  async function loadEvents(){
    const list = document.getElementById('eventsList');
    try{
      const res = await fetch(`${API}/events`);
      const events = await res.json();

      if(!events.length){
        list.innerHTML = `<div class="empty-state">No events yet — check back soon.</div>`;
        return;
      }

      list.innerHTML = events.map(renderRow).join('');
    }catch(err){
      list.innerHTML = `<div class="empty-state">Could not load events. Is the backend running?</div>`;
    }
  }
  loadEvents();
</script>
</body>
</html>
