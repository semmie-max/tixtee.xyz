<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Event — Tixtee</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --black: #0b0b0d;
  --text: #17171a;
  --muted: #77777f;
  --line: #e9e9ec;
  --soft: #f7f7f8;
  --purple: #6d4aff;
  --purple-dark: #5638df;
  --white: #ffffff;
}

body {
  font-family: "DM Sans", sans-serif;
  background: #fff;
  color: var(--text);
  min-height: 100vh;
}

button {
  font-family: inherit;
}

/* =========================
   NAVBAR
========================= */

.navbar {
  width: 100%;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5%;
  border-bottom: 1px solid var(--line);
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 20;
}

.logo {
  text-decoration: none;
  color: var(--black);
  font-family: "Plus Jakarta Sans", sans-serif;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -1px;
}

.logo span {
  color: var(--purple);
}

.nav-link {
  text-decoration: none;
  color: #55555d;
  font-size: 14px;
  font-weight: 600;
}

.nav-link:hover {
  color: var(--black);
}

/* =========================
   LOADING
========================= */

.loading {
  min-height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 15px;
}

/* =========================
   PAGE
========================= */

.event-page {
  max-width: 1180px;
  margin: 0 auto;
  padding: 42px 24px 90px;
}

/* =========================
   HERO IMAGE
========================= */

.event-cover {
  width: 100%;
  height: min(58vw, 540px);
  min-height: 280px;
  border-radius: 24px;
  overflow: hidden;
  background: #eeeeF1;
  position: relative;
}

.event-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.event-cover-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  font-size: 14px;
}

/* =========================
   MAIN CONTENT
========================= */

.event-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 350px;
  gap: 70px;
  margin-top: 48px;
}

.event-main {
  min-width: 0;
}

.event-title {
  font-family: "Plus Jakarta Sans", sans-serif;
  font-size: clamp(34px, 5vw, 62px);
  line-height: 1.03;
  letter-spacing: -2.8px;
  font-weight: 800;
  color: var(--black);
  margin-bottom: 30px;
}

.event-meta {
  display: grid;
  gap: 18px;
  margin-bottom: 42px;
}

.meta-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
}

.meta-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: #f2efff;
  color: var(--purple);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 18px;
}

.meta-content {
  padding-top: 2px;
}

.meta-label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 3px;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.meta-value {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.section {
  margin-top: 48px;
}

.section-title {
  font-family: "Plus Jakarta Sans", sans-serif;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.5px;
  margin-bottom: 16px;
}

.description {
  color: #5e5e66;
  font-size: 16px;
  line-height: 1.8;
  white-space: pre-line;
}

/* =========================
   TICKET CARD
========================= */

.ticket-panel {
  position: sticky;
  top: 100px;
  align-self: start;
}

.ticket-card {
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 25px;
  background: white;
  box-shadow: 0 12px 40px rgba(0,0,0,.06);
}

.ticket-card-title {
  font-family: "Plus Jakarta Sans", sans-serif;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 20px;
}

.ticket-list {
  display: grid;
  gap: 12px;
}

.ticket-option {
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 16px;
  transition: .2s ease;
}

.ticket-option:hover {
  border-color: #c9bfff;
}

.ticket-top {
  display: flex;
  justify-content: space-between;
  gap: 15px;
}

.ticket-name {
  font-weight: 700;
  font-size: 14px;
}

.ticket-price {
  font-weight: 800;
  font-size: 14px;
  white-space: nowrap;
}

.ticket-description {
  color: var(--muted);
  font-size: 12px;
  margin-top: 7px;
  line-height: 1.5;
}

.ticket-button {
  width: 100%;
  border: 0;
  border-radius: 13px;
  background: var(--black);
  color: white;
  height: 52px;
  margin-top: 20px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s ease;
}

.ticket-button:hover {
  background: var(--purple);
  transform: translateY(-1px);
}

/* =========================
   ORGANIZER
========================= */

.organizer {
  border-top: 1px solid var(--line);
  padding-top: 25px;
  margin-top: 50px;
}

.organizer-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.organizer-name {
  font-weight: 700;
  font-size: 15px;
}

/* =========================
   FOOTER
========================= */

.footer {
  border-top: 1px solid var(--line);
  padding: 28px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  color: var(--muted);
  font-size: 12px;
}

.footer-logo {
  font-family: "Plus Jakarta Sans", sans-serif;
  color: var(--black);
  font-weight: 800;
}

/* =========================
   ERROR
========================= */

.error-page {
  min-height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  text-align: center;
}

.error-box h1 {
  font-family: "Plus Jakarta Sans", sans-serif;
  font-size: 32px;
  margin-bottom: 10px;
}

.error-box p {
  color: var(--muted);
}

/* =========================
   MOBILE
========================= */

.mobile-ticket {
  display: none;
}

@media (max-width: 800px) {

  .navbar {
    height: 64px;
    padding: 0 20px;
  }

  .nav-link {
    display: none;
  }

  .event-page {
    padding: 20px 16px 100px;
  }

  .event-cover {
    height: 58vw;
    min-height: 210px;
    border-radius: 17px;
  }

  .event-layout {
    display: block;
    margin-top: 32px;
  }

  .event-title {
    font-size: clamp(34px, 11vw, 48px);
    letter-spacing: -2px;
    margin-bottom: 25px;
  }

  .event-meta {
    margin-bottom: 32px;
  }

  .section {
    margin-top: 36px;
  }

  .ticket-panel {
    margin-top: 40px;
    position: static;
  }

  .ticket-card {
    box-shadow: none;
  }

  .mobile-ticket {
    display: block;
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 12px;
    z-index: 50;
  }

  .mobile-ticket button {
    width: 100%;
    height: 54px;
    border: 0;
    border-radius: 15px;
    background: var(--black);
    color: white;
    font-size: 15px;
    font-weight: 700;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
  }

  .footer {
    padding: 25px 20px;
    flex-direction: column;
    align-items: flex-start;
  }
}

@media (max-width: 430px) {

  .event-cover {
    margin-left: -16px;
    width: calc(100% + 32px);
    border-radius: 0;
  }

  .event-title {
    font-size: 35px;
  }
}
</style>
</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">
  <a href="/" class="logo">tix<span>tee</span></a>
  <a href="/" class="nav-link">Create an event</a>
</nav>


<!-- =========================
     LOADING
========================= -->

<div id="loading" class="loading">
  Loading event…
</div>


<!-- =========================
     EVENT PAGE
========================= -->

<main id="eventPage" class="event-page" style="display:none;">

  <div class="event-cover" id="eventCover">
    <div class="event-cover-placeholder">
      Event image
    </div>
  </div>


  <div class="event-layout">

    <!-- LEFT SIDE -->

    <section class="event-main">

      <h1 id="eventTitle" class="event-title">
        Event title
      </h1>


      <div class="event-meta">

        <div class="meta-item">
          <div class="meta-icon">◷</div>

          <div class="meta-content">
            <span class="meta-label">Date & time</span>
            <span id="eventDate" class="meta-value">—</span>
          </div>
        </div>


        <div class="meta-item">
          <div class="meta-icon">⌖</div>

          <div class="meta-content">
            <span class="meta-label">Location</span>
            <span id="eventVenue" class="meta-value">—</span>
          </div>
        </div>

      </div>


      <section class="section">

        <h2 class="section-title">
          About this event
        </h2>

        <div id="eventDescription" class="description">
          —
        </div>

      </section>


      <div class="organizer">

        <div class="organizer-label">
          Organized by
        </div>

        <div id="organizerName" class="organizer-name">
          —
        </div>

      </div>

    </section>


    <!-- RIGHT SIDE -->

    <aside class="ticket-panel">

      <div class="ticket-card">

        <h2 class="ticket-card-title">
          Get your ticket
        </h2>

        <div id="ticketList" class="ticket-list">
          <div class="ticket-option">

            <div class="ticket-top">
              <span class="ticket-name">
                General Admission
              </span>

              <span class="ticket-price">
                —
              </span>
            </div>

          </div>
        </div>

        <button id="ticketButton" class="ticket-button">
          Get Ticket
        </button>

      </div>

    </aside>

  </div>

</main>


<!-- =========================
     ERROR
========================= -->

<div id="errorPage" class="error-page" style="display:none;">

  <div class="error-box">

    <h1>Event not found</h1>

    <p>
      This event may have been removed or the link is incorrect.
    </p>

  </div>

</div>


<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

  <div class="footer-logo">
    tixtee
  </div>

  <div>
    Great events start with a single ticket.
  </div>

</footer>


<!-- MOBILE TICKET BUTTON -->

<div class="mobile-ticket">
  <button id="mobileTicketButton">
    Get Ticket
  </button>
</div>


<script>

const API = 'https://api.tixtee.xyz/api';

const params = new URLSearchParams(window.location.search);
const slug = params.get('slug');

const loading = document.getElementById('loading');
const eventPage = document.getElementById('eventPage');
const errorPage = document.getElementById('errorPage');

const eventTitle = document.getElementById('eventTitle');
const eventDate = document.getElementById('eventDate');
const eventVenue = document.getElementById('eventVenue');
const eventDescription = document.getElementById('eventDescription');
const organizerName = document.getElementById('organizerName');
const eventCover = document.getElementById('eventCover');
const ticketList = document.getElementById('ticketList');

const ticketButton = document.getElementById('ticketButton');
const mobileTicketButton = document.getElementById('mobileTicketButton');


/* =========================
   HELPERS
========================= */

function showError() {

  loading.style.display = 'none';
  eventPage.style.display = 'none';
  errorPage.style.display = 'flex';

}


function formatDate(date) {

  if (!date) return 'Date to be announced';

  const d = new Date(date);

  if (isNaN(d.getTime())) {
    return date;
  }

  return d.toLocaleDateString('en-NG', {
    weekday: 'long',
    day: 'numeric',
    month: 'long',
    year: 'numeric'
  });
}


function escapeHTML(value) {

  if (value === null || value === undefined) {
    return '';
  }

  const div = document.createElement('div');
  div.textContent = value;

  return div.innerHTML;
}


/* =========================
   LOAD EVENT
========================= */

async function loadEvent() {

  if (!slug) {
    showError();
    return;
  }

  try {

    const res = await fetch(
      `${API}/events/${encodeURIComponent(slug)}`
    );

    if (!res.ok) {
      throw new Error('Event not found');
    }

    const ev = await res.json();

    console.log('Event:', ev);

    renderEvent(ev);

  } catch (err) {

    console.error(err);

    showError();

  }

}


/* =========================
   RENDER EVENT
========================= */

function renderEvent(ev) {

  loading.style.display = 'none';
  eventPage.style.display = 'block';

  /* TITLE */

  eventTitle.textContent =
    ev.title ||
    ev.name ||
    'Untitled Event';


  /* DATE */

  eventDate.textContent =
    formatDate(
      ev.event_date ||
      ev.date ||
      ev.start_date
    );


  /* TIME */

  if (ev.time) {

    eventDate.textContent += ` · ${ev.time}`;

  }


  /* VENUE */

  eventVenue.textContent =
    ev.venue ||
    ev.location ||
    ev.address ||
    'Location to be announced';


  /* DESCRIPTION */

  eventDescription.textContent =
    ev.description ||
    'More information about this event will be available soon.';


  /* ORGANIZER */

  organizerName.textContent =
    ev.organizer_name ||
    ev.organizer ||
    ev.creator_name ||
    'Tixtee Organizer';


  /* EVENT IMAGE */

const image = ev.image_url;

if (image) {

  let imageUrl = image;

  if (imageUrl.startsWith('/')) {
    imageUrl = `https://api.tixtee.xyz${imageUrl}`;
  }

  eventCover.innerHTML = `
    <img
      src="${escapeHTML(imageUrl)}"
      alt="${escapeHTML(ev.title || 'Event')}"
    >
  `;

}

  /* TICKETS */

  renderTickets(ev);


  /* PAGE TITLE */

  document.title =
    `${ev.title || 'Event'} — Tixtee`;

}


/* =========================
   TICKETS
========================= */

function renderTickets(ev) {

  const tickets =
    ev.tickets ||
    ev.ticket_types ||
    ev.ticketTiers ||
    [];

  if (!Array.isArray(tickets) || tickets.length === 0) {

    ticketList.innerHTML = `
      <div class="ticket-option">
        <div class="ticket-top">
          <span class="ticket-name">
            Tickets
          </span>

          <span class="ticket-price">
            Available
          </span>
        </div>

        <div class="ticket-description">
          Tickets are available for this event.
        </div>
      </div>
    `;

    return;
  }


  ticketList.innerHTML = tickets.map(ticket => {

    const name =
      ticket.name ||
      ticket.title ||
      'General Admission';

    const price =
      ticket.price !== undefined
        ? `₦${Number(ticket.price).toLocaleString()}`
        : 'Free';


    return `
      <div class="ticket-option">

        <div class="ticket-top">

          <span class="ticket-name">
            ${escapeHTML(name)}
          </span>

          <span class="ticket-price">
            ${escapeHTML(price)}
          </span>

        </div>

        ${
          ticket.description
            ? `
              <div class="ticket-description">
                ${escapeHTML(ticket.description)}
              </div>
            `
            : ''
        }

      </div>
    `;

  }).join('');

}


/* =========================
   TICKET BUTTON
========================= */

function getTicket() {

  /*
    Put your ticket purchase route here.

    Example:

    window.location.href =
      `/checkout/?slug=${encodeURIComponent(slug)}`;
  */

  console.log('Get ticket:', slug);

}


ticketButton.addEventListener('click', getTicket);

mobileTicketButton.addEventListener('click', getTicket);


/* =========================
   START
========================= */

loadEvent();

</script>

</body>
</html>
