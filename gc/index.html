<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Chat — Tixtee</title>
<link rel="icon" type="image/png" href="/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
  html,body{height:100%;overflow:hidden;}
  body{ background:#101218; color:#e8e9ec; display:flex; }

  :root{
    --panel:#181b23; --panel-2:#1e222c; --bubble-in:#262b37; --bubble-out:#e34b42;
    --border:#262a34; --muted:#7d8290; --text:#eceef2;
  }

  .topbar{
    position:fixed; top:0; left:0; right:0; height:56px;
    display:flex; align-items:center; gap:14px;
    padding:0 20px; background:#0d0f14; border-bottom:1px solid var(--border);
    z-index:20;
  }
  .topbar .back-btn{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--border);
    background:var(--panel); color:#e8e9ec; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; text-decoration:none;
  }
  .topbar .back-btn svg{width:15px;height:15px;}
  .topbar h1{font-size:15px; font-weight:700;}

  .app-body{ width:100%; height:100%; padding-top:56px; display:flex; align-items:center; justify-content:center; }

  /* ---------- join screen ---------- */
  .join-card{
    width:100%; max-width:360px; background:var(--panel); border:1px solid var(--border);
    border-radius:20px; padding:32px 26px; text-align:center;
  }
  .join-avatar{
    width:64px; height:64px; border-radius:50%; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; color:#fff;
  }
  .join-card h2{ font-size:17px; font-weight:700; margin-bottom:6px; color:var(--text); }
  .join-card p{ font-size:12.5px; color:var(--muted); margin-bottom:22px; }
  .join-card input{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font-size:14px; outline:none; margin-bottom:14px;
  }
  .join-card input:focus{ border-color:var(--bubble-out); }
  .join-btn{
    width:100%; padding:13px; border-radius:12px; border:none; background:var(--bubble-out); color:#fff;
    font-size:14px; font-weight:700; cursor:pointer;
  }
  .join-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .join-err{ font-size:12px; color:#ff8a80; margin-top:-4px; margin-bottom:12px; display:none; }

  .center-msg{ text-align:center; color:var(--muted); padding:20px; font-size:13.5px; }
  .center-msg a{ color:var(--bubble-out); }

  /* ---------- chat screen (matches document 6's conversation-pane) ---------- */
  .conversation-pane{
    flex:1; display:flex; flex-direction:column; background:#14161d; min-width:0;
    width:100%; height:100%;
  }
  @media (min-width:1300px){
    .conversation-pane{ max-width:1300px; margin:0 auto; }
  }
  .conv-header{
    display:flex; align-items:center; gap:12px;
    padding:14px 22px; border-bottom:1px solid var(--border); background:var(--panel);
    flex-shrink:0;
  }
  .conv-header-avatar{
    width:38px; height:38px; border-radius:50%; flex-shrink:0; object-fit:cover;
    background:linear-gradient(135deg,#e34b42,#7a1f1a);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff;
  }
  .conv-title{ font-size:14px; font-weight:700; color:var(--text); }
  .conv-sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .conv-messages{
    flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:4px;
  }
  .msg-row{ display:flex; margin-bottom:10px; }
  .msg-row.out{ justify-content:flex-end; }
  .msg-bubble{
    max-width:76%; padding:10px 14px; border-radius:16px; font-size:13px; line-height:1.45;
    position:relative;
  }
  .msg-row.in .msg-bubble{
    background:var(--bubble-in); color:var(--text); border-bottom-left-radius:4px;
  }
  .msg-row.out .msg-bubble{
    background:var(--bubble-out); color:#fff; border-bottom-right-radius:4px;
  }
  .msg-sender{ font-size:10.5px; font-weight:700; color:var(--muted); margin:0 4px 4px; }
  .msg-time{ font-size:9.5px; opacity:.7; margin-top:4px; display:block; text-align:right; }

  .conv-empty, .conv-loading{
    flex:1; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px;
    text-align:center; padding:40px;
  }

  .conv-composer{
    display:flex; align-items:center; gap:10px;
    padding:14px 18px; border-top:1px solid var(--border); background:var(--panel); flex-shrink:0;
  }
  .conv-composer input{
    flex:1; background:var(--panel-2); border:1px solid var(--border); border-radius:22px;
    padding:11px 16px; color:var(--text); font-size:13px; outline:none;
  }
  .conv-composer input::placeholder{ color:var(--muted); }
  .send-btn{
    width:38px; height:38px; border-radius:50%; border:none; background:var(--bubble-out); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .send-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .send-btn svg{ width:16px; height:16px; }

  @media (max-width:760px){
    .msg-bubble{ max-width:82%; }
  }

    .unread-badge{ background:var(--bubble-out); color:#fff; font-size:10px; font-weight:700; border-radius:100px; padding:2px 7px; margin-left:6px; }
  .msg-row{ position:relative; touch-action:pan-y; }
  .msg-bubble-wrap{ position:relative; transition:transform .15s ease; }
  .swipe-reply-icon{
    position:absolute; top:50%; left:-30px; transform:translateY(-50%);
    color:var(--muted); opacity:0; transition:opacity .15s ease; font-size:16px;
  }
  .msg-row.swiping .swipe-reply-icon{ opacity:1; }
  .reply-preview{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    background:var(--panel-2); border-left:3px solid var(--bubble-out);
    padding:8px 12px; margin:0 18px; border-radius:8px 8px 0 0; font-size:12px; color:var(--muted);
  }
  .reply-preview.show{ display:flex; }
  .reply-preview-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .reply-preview-close{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; flex-shrink:0; }
  .msg-quote{
    font-size:11px; opacity:.75; border-left:2px solid rgba(255,255,255,0.4);
    padding-left:8px; margin-bottom:5px; display:block;
  }
  .mention-tag{ color:#6fb3ff; font-weight:600; }
  .composer-wrap{ position:relative; flex:1; }
  .composer-wrap input{ width:100%; }
  .mention-dropdown{
    display:none; position:absolute; bottom:100%; left:0; right:0; margin-bottom:6px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:12px;
    max-height:180px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:30;
  }
  .mention-dropdown.show{ display:block; }
  .mention-item{
    display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:pointer; font-size:13px; color:var(--text);
  }
  .mention-item:hover, .mention-item.active{ background:var(--panel); }
  .mention-item .mi-avatar{
    width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,#e34b42,#7a1f1a);
    display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; flex-shrink:0;
  }
  .mention-tag-me{ background:rgba(111,179,255,0.28); padding:1px 5px; border-radius:5px; }
  .mention-banner{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    background:#1f4a7a; color:#dbe9ff; padding:9px 16px; margin:0 18px; border-radius:10px 10px 0 0;
    font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .mention-banner.show{ display:flex; }
  @keyframes flashHighlight{
    0%{ box-shadow:0 0 0 3px rgba(111,179,255,0.9); }
    100%{ box-shadow:0 0 0 0 rgba(111,179,255,0); }
  }
  .msg-row.flash .msg-bubble{ animation:flashHighlight 1.4s ease; }
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="back-btn" aria-label="Back to home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </a>
  <h1 id="topbarTitle">Group Chat</h1>
</div>

<div class="app-body" id="appBody">
  <div class="center-msg" id="loadingMsg">Loading chat…</div>
</div>

<script>
  const API = 'https://api.tixtee.xyz/api';
  const COLORS = ['#e34b42','#47034E','#1e7a3d','#c9a227','#2f6fed','#8a4b90','#d9534f','#20c997','#e07a3f','#5c6ac4'];

  const params = new URLSearchParams(window.location.search);
  const pathParts = window.location.pathname.split('/').filter(Boolean); // e.g. ['gc', 'rvm']
  const pathSlug = pathParts[0] === 'gc' ? pathParts[1] : null;
  const slug = pathSlug || params.get('slug');
  const appBody = document.getElementById('appBody');
  const topbarTitle = document.getElementById('topbarTitle');

  let eventInfo = null;
  let guest = null;
  let pollTimer = null;
  let lastCount = 0;

  function initials(name){
    if(!name) return '?';
    return name.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join('');
  }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function formatTime(iso){
    if(!iso) return '';
    return new Date(iso).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
  }
  function guestKey(){ return `tixtee_guest_${eventInfo.id}`; }

    let unreadCount = 0;
  const baseTitle = 'Group Chat — Tixtee';
  let replyTarget = null; // { text, sender }
  let knownMembers = new Set();
  let pendingMentionIndex = null;

  function highlightMentions(text){
    let escaped = escapeHtml(text);
    if(!knownMembers.size) return escaped;
    Array.from(knownMembers).sort((a,b) => b.length - a.length).forEach(name => {
      const safe = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const isMe = guest && name.toLowerCase() === guest.name.toLowerCase();
      const cls = isMe ? 'mention-tag mention-tag-me' : 'mention-tag';
      escaped = escaped.replace(new RegExp(`@${safe}\\b`, 'g'), `<span class="${cls}">@${escapeHtml(name)}</span>`);
    });
    return escaped;
  }
  function mentionsMe(text){
    if(!guest) return false;
    const safe = guest.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return new RegExp(`@${safe}\\b`, 'i').test(text);
  }

  let audioCtx = null;
  function unlockAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }
  document.addEventListener('touchstart', unlockAudio, { once:true });
  document.addEventListener('click', unlockAudio, { once:true });

  function playPing(){
    try{
      if(!audioCtx || audioCtx.state !== 'running') return;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.3);
    }catch(e){}
  }
  function bumpUnread(){
    unreadCount++;
    document.title = `(${unreadCount}) ${baseTitle}`;
    playPing();
  }
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden){ unreadCount = 0; document.title = baseTitle; }
  });

  function attachSwipeToReply(rowEl, msg){
    let startX = 0, dx = 0, dragging = false;
    const wrap = rowEl.querySelector('.msg-bubble');
    const start = (x) => { startX = x; dragging = true; };
    const move = (x) => {
      if(!dragging) return;
      dx = x - startX;
      if(dx < 0 && dx > -70){
        wrap.style.transform = `translateX(${dx}px)`;
        rowEl.classList.add('swiping');
      }
    };
    const end = () => {
      if(dragging && dx < -45){
        const quoteMatch = msg.message.match(/^↳ Reply to "([^"]*)":\s?(.*)$/s);
        const cleanText = quoteMatch ? quoteMatch[2] : msg.message;
        replyTarget = { text: cleanText, sender: msg.guest_name || 'Guest' };
        showReplyPreview();
      }
      wrap.style.transform = ''; rowEl.classList.remove('swiping');
      dragging = false; dx = 0;
    };
    rowEl.addEventListener('touchstart', (e) => start(e.touches[0].clientX));
    rowEl.addEventListener('touchmove', (e) => move(e.touches[0].clientX));
    rowEl.addEventListener('touchend', end);
    rowEl.addEventListener('mousedown', (e) => start(e.clientX));
    rowEl.addEventListener('mousemove', (e) => move(e.clientX));
    rowEl.addEventListener('mouseup', end);
    rowEl.addEventListener('mouseleave', () => { if(dragging) end(); });
  }
  function showReplyPreview(){
    let bar = document.getElementById('replyPreviewBar');
    if(!bar) return;
    bar.classList.add('show');
    bar.querySelector('.reply-preview-text').textContent = `Replying to ${replyTarget.sender}: ${replyTarget.text}`;
  }
  function clearReplyPreview(){
    replyTarget = null;
    const bar = document.getElementById('replyPreviewBar');
    if(bar) bar.classList.remove('show');
  }

  async function init(){
    if(!slug){
      appBody.innerHTML = `<div class="center-msg">No chat specified. <a href="/">Go home</a></div>`;
      return;
    }
    try{
      const res = await fetch(`${API}/chat/slug/${encodeURIComponent(slug)}`);
      if(!res.ok){
        appBody.innerHTML = `<div class="center-msg">This chat link isn't active. <a href="/">Go home</a></div>`;
        return;
      }
      eventInfo = await res.json();
      topbarTitle.textContent = eventInfo.groupchat_name || eventInfo.title;

      const saved = localStorage.getItem(guestKey());
      if(saved){
        guest = JSON.parse(saved);
        renderChatScreen();
      } else {
        renderJoinScreen();
      }
    }catch(err){
      appBody.innerHTML = `<div class="center-msg">Could not reach the server. <a href="/">Go home</a></div>`;
    }
  }

  function renderJoinScreen(){
    const previewColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    appBody.innerHTML = `
      <div class="join-card">
        <div class="join-avatar" id="joinAvatar" style="background:${previewColor};">?</div>
        <h2>${escapeHtml(eventInfo.groupchat_name || eventInfo.title)}</h2>
        <p>Enter your name to join the chat.</p>
        <input type="text" id="joinNameInput" placeholder="Your name" maxlength="40">
        <div class="join-err" id="joinErr">Please enter a name.</div>
        <button type="button" class="join-btn" id="joinBtn">Join chat</button>
      </div>
    `;
    const nameInput = document.getElementById('joinNameInput');
    const avatarEl = document.getElementById('joinAvatar');
    nameInput.addEventListener('input', () => {
      avatarEl.textContent = initials(nameInput.value) || '?';
    });
    nameInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') doJoin(); });
    document.getElementById('joinBtn').addEventListener('click', doJoin);

    function doJoin(){
      const name = nameInput.value.trim();
      if(!name){
        document.getElementById('joinErr').style.display = 'block';
        return;
      }
      guest = { name, color: previewColor };
      localStorage.setItem(guestKey(), JSON.stringify(guest));
      renderChatScreen();
    }
  }

  function renderChatScreen(){
    appBody.innerHTML = `
      <div class="conversation-pane">
        <div class="conv-header">
          <div class="conv-header-avatar">${initials(eventInfo.groupchat_name || eventInfo.title)}</div>
          <div>
            <div class="conv-title">${escapeHtml(eventInfo.groupchat_name || eventInfo.title)}</div>
            <div class="conv-sub">Chatting as ${escapeHtml(guest.name)}</div>
          </div>
        </div>
        <div class="conv-messages" id="convMessages">
          <div class="conv-loading">Loading conversation…</div>
        </div>
                <div class="mention-banner" id="mentionBanner">
          <span>@ You were mentioned — tap to view</span>
          <span>↓</span>
        </div>
        <div class="reply-preview" id="replyPreviewBar">
          <div class="reply-preview-text"></div>
          <button type="button" class="reply-preview-close" id="replyPreviewClose">✕</button>
        </div>
        <div class="conv-composer">
          <div class="composer-wrap">
            <div class="mention-dropdown" id="mentionDropdown"></div>
            <input type="text" id="messageInput" placeholder="Type a message" maxlength="1000">
          </div>
          <button type="button" class="send-btn" id="sendBtn" disabled aria-label="Send">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
          </button>
        </div>
      </div>
    `;

    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const mentionDropdown = document.getElementById('mentionDropdown');
    let mentionMatches = [];
    let mentionActiveIndex = 0;

    function getMentionQuery(){
      const before = messageInput.value.slice(0, messageInput.selectionStart);
      const m = before.match(/(?:^|\s)@([a-zA-Z0-9_]*)$/);
      return m ? m[1] : null;
    }
    function renderMentionDropdown(){
      mentionDropdown.innerHTML = mentionMatches.map((name, i) => `
        <div class="mention-item${i === mentionActiveIndex ? ' active' : ''}" data-name="${escapeHtml(name)}">
          <div class="mi-avatar">${initials(name)}</div>
          <div>${escapeHtml(name)}</div>
        </div>
      `).join('');
      mentionDropdown.classList.add('show');
      mentionDropdown.querySelectorAll('.mention-item').forEach(el => {
        el.addEventListener('mousedown', (e) => { e.preventDefault(); selectMention(el.dataset.name); });
      });
    }
    function updateMentionDropdown(){
      const query = getMentionQuery();
      if(query === null){ mentionDropdown.classList.remove('show'); mentionMatches = []; return; }
      mentionMatches = Array.from(knownMembers).filter(n => n.toLowerCase().startsWith(query.toLowerCase()));
      if(!mentionMatches.length){ mentionDropdown.classList.remove('show'); return; }
      mentionActiveIndex = 0;
      renderMentionDropdown();
    }
    function selectMention(name){
      const val = messageInput.value;
      const pos = messageInput.selectionStart;
      const before = val.slice(0, pos);
      const after = val.slice(pos);
      const newBefore = before.replace(/(?:^|\s)@([a-zA-Z0-9_]*)$/, (m) => {
        const lead = /^\s/.test(m) ? m[0] : '';
        return `${lead}@${name} `;
      });
      messageInput.value = newBefore + after;
      const newPos = newBefore.length;
      messageInput.focus();
      messageInput.setSelectionRange(newPos, newPos);
      mentionDropdown.classList.remove('show');
      mentionMatches = [];
      sendBtn.disabled = !messageInput.value.trim();
    }

    messageInput.addEventListener('input', () => {
      sendBtn.disabled = !messageInput.value.trim();
      updateMentionDropdown();
    });
    messageInput.addEventListener('blur', () => {
      setTimeout(() => { mentionDropdown.classList.remove('show'); mentionMatches = []; }, 150);
    });
    messageInput.addEventListener('keydown', (e) => {
      if(mentionDropdown.classList.contains('show') && mentionMatches.length){
        if(e.key === 'ArrowDown'){ e.preventDefault(); mentionActiveIndex = (mentionActiveIndex + 1) % mentionMatches.length; renderMentionDropdown(); return; }
        if(e.key === 'ArrowUp'){ e.preventDefault(); mentionActiveIndex = (mentionActiveIndex - 1 + mentionMatches.length) % mentionMatches.length; renderMentionDropdown(); return; }
        if(e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); selectMention(mentionMatches[mentionActiveIndex]); return; }
        if(e.key === 'Escape'){ mentionDropdown.classList.remove('show'); mentionMatches = []; return; }
      }
      if(e.key === 'Enter' && !sendBtn.disabled) sendMessage();
    });
    sendBtn.addEventListener('click', sendMessage);
    sendBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
    }, { passive: false });
    document.getElementById('replyPreviewClose').addEventListener('click', clearReplyPreview);
    document.getElementById('mentionBanner').addEventListener('click', jumpToMention);

    loadMessages(true);
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => loadMessages(false), 4000);
  }

    async function loadMessages(showLoading){
    const msgEl = document.getElementById('convMessages');
    try{
      const res = await fetch(`${API}/chat/public/${eventInfo.id}/messages`);
      const messages = await res.json();
      messages.forEach(m => knownMembers.add(m.guest_name || 'Guest'));
      const isNew = messages.length > lastCount;
      if(messages.length === lastCount && !showLoading) return;

      const prevCount = lastCount;
      if(isNew && !showLoading){
        const newest = messages[messages.length - 1];
        const isMineNewest = newest.guest_name === guest.name && newest.guest_color === guest.color;
        if(!isMineNewest && document.hidden) bumpUnread();
        if(!isMineNewest && !document.hidden) playPing();

        for(let i = prevCount; i < messages.length; i++){
          const m = messages[i];
          const isMineMsg = m.guest_name === guest.name && m.guest_color === guest.color;
          if(!isMineMsg && mentionsMe(m.message)){
            pendingMentionIndex = i;
            document.getElementById('mentionBanner').classList.add('show');
            if(document.hidden) bumpUnread();
            playPing();
          }
        }
      }
      lastCount = messages.length;

      if(!messages.length){
        msgEl.innerHTML = `<div class="conv-empty">No messages yet. Say hello 👋</div>`;
        return;
      }

      msgEl.innerHTML = '';
      messages.forEach((m, i) => {
        const isMe = m.guest_name === guest.name && m.guest_color === guest.color;
        const row = document.createElement('div');
        row.className = `msg-row ${isMe ? 'out' : 'in'}`;
        row.id = `msg-idx-${i}`;
        const quoteMatch = m.message.match(/^↳ Reply to "([^"]*)":\s?(.*)$/s);
        const bodyText = quoteMatch ? quoteMatch[2] : m.message;
        const quoteText = quoteMatch ? quoteMatch[1] : null;
        row.innerHTML = `
          <div class="msg-bubble">
            ${isMe ? '' : `<div class="msg-sender">${escapeHtml(m.guest_name || 'Guest')}</div>`}
            ${quoteText ? `<span class="msg-quote">${escapeHtml(quoteText)}</span>` : ''}
            ${highlightMentions(bodyText)}
            <span class="msg-time">${formatTime(m.created_at)}</span>
          </div>`;
        attachSwipeToReply(row, m);
        msgEl.appendChild(row);
      });
      msgEl.scrollTop = msgEl.scrollHeight;
    }catch(err){
      if(showLoading) msgEl.innerHTML = `<div class="conv-empty">Could not load messages.</div>`;
    }
  }

  function jumpToMention(){
    if(pendingMentionIndex === null) return;
    const el = document.getElementById(`msg-idx-${pendingMentionIndex}`);
    document.getElementById('mentionBanner').classList.remove('show');
    if(!el){ pendingMentionIndex = null; return; }
    el.scrollIntoView({ behavior:'smooth', block:'center' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1400);
    pendingMentionIndex = null;
  }

    async function sendMessage(){
    const input = document.getElementById('messageInput');
    const btn = document.getElementById('sendBtn');
    let text = input.value.trim();
    if(!text) return;
    if(replyTarget){
      text = `↳ Reply to "${replyTarget.text.slice(0,60)}": ${text}`;
    }
    btn.disabled = true;
    input.value = '';
    clearReplyPreview();
    try{
      const res = await fetch(`${API}/chat/public/${eventInfo.id}/messages`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ message: text, guest_name: guest.name, guest_color: guest.color })
      });
      if(!res.ok) throw new Error();
      await loadMessages(false);
    }catch(err){
      input.value = text;
      alert('Could not send that message.');
    }
  }

  init();
</script>
</body>
</html>
