<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Chat — Tixtee</title>
<link rel="icon" type="image/png" href="/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
  html,body{height:100%;overflow:hidden;}
  body{ background:#101218; color:#e8e9ec; display:flex; }

  :root{
    --panel:#181b23; --panel-2:#1e222c; --bubble-in:#262b37; --bubble-out:#e34b42;
    --border:#262a34; --muted:#7d8290; --text:#eceef2;
  }

  .topbar{
    position:fixed; top:0; left:0; right:0; height:56px;
    display:flex; align-items:center; gap:14px;
    padding:0 20px; background:#0d0f14; border-bottom:1px solid var(--border);
    z-index:20;
  }
  .topbar .back-btn{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--border);
    background:var(--panel); color:#e8e9ec; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; text-decoration:none;
  }
  .topbar .back-btn svg{width:15px;height:15px;}
  .topbar h1{font-size:15px; font-weight:700;}

  .app-body{ width:100%; height:100%; padding-top:56px; display:flex; align-items:center; justify-content:center; }

  /* ---------- join screen ---------- */
  .join-card{
    width:100%; max-width:360px; background:var(--panel); border:1px solid var(--border);
    border-radius:20px; padding:32px 26px; text-align:center;
  }
  .join-avatar{
    width:64px; height:64px; border-radius:50%; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; color:#fff;
  }
  .join-card h2{ font-size:17px; font-weight:700; margin-bottom:6px; color:var(--text); }
  .join-card p{ font-size:12.5px; color:var(--muted); margin-bottom:22px; }
  .join-card input{
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font-size:14px; outline:none; margin-bottom:14px;
  }
  .join-card input:focus{ border-color:var(--bubble-out); }
  .join-btn{
    width:100%; padding:13px; border-radius:12px; border:none; background:var(--bubble-out); color:#fff;
    font-size:14px; font-weight:700; cursor:pointer;
  }
  .join-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .join-err{ font-size:12px; color:#ff8a80; margin-top:-4px; margin-bottom:12px; display:none; }

  .center-msg{ text-align:center; color:var(--muted); padding:20px; font-size:13.5px; }
  .center-msg a{ color:var(--bubble-out); }

  /* ---------- chat screen (matches document 6's conversation-pane) ---------- */
  .conversation-pane{
    flex:1; display:flex; flex-direction:column; background:#14161d; min-width:0;
    width:100%; max-width:640px; height:100%;
  }
  .conv-header{
    display:flex; align-items:center; gap:12px;
    padding:14px 22px; border-bottom:1px solid var(--border); background:var(--panel);
    flex-shrink:0;
  }
  .conv-header-avatar{
    width:38px; height:38px; border-radius:50%; flex-shrink:0; object-fit:cover;
    background:linear-gradient(135deg,#e34b42,#7a1f1a);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff;
  }
  .conv-title{ font-size:14px; font-weight:700; color:var(--text); }
  .conv-sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .conv-messages{
    flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:4px;
  }
  .msg-row{ display:flex; margin-bottom:10px; }
  .msg-row.out{ justify-content:flex-end; }
  .msg-bubble{
    max-width:76%; padding:10px 14px; border-radius:16px; font-size:13px; line-height:1.45;
    position:relative;
  }
  .msg-row.in .msg-bubble{
    background:var(--bubble-in); color:var(--text); border-bottom-left-radius:4px;
  }
  .msg-row.out .msg-bubble{
    background:var(--bubble-out); color:#fff; border-bottom-right-radius:4px;
  }
  .msg-sender{ font-size:10.5px; font-weight:700; color:var(--muted); margin:0 4px 4px; }
  .msg-time{ font-size:9.5px; opacity:.7; margin-top:4px; display:block; text-align:right; }

  .conv-empty, .conv-loading{
    flex:1; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px;
    text-align:center; padding:40px;
  }

  .conv-composer{
    display:flex; align-items:center; gap:10px;
    padding:14px 18px; border-top:1px solid var(--border); background:var(--panel); flex-shrink:0;
  }
  .conv-composer input{
    flex:1; background:var(--panel-2); border:1px solid var(--border); border-radius:22px;
    padding:11px 16px; color:var(--text); font-size:13px; outline:none;
  }
  .conv-composer input::placeholder{ color:var(--muted); }
  .send-btn{
    width:38px; height:38px; border-radius:50%; border:none; background:var(--bubble-out); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .send-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .send-btn svg{ width:16px; height:16px; }

  @media (max-width:760px){
    .msg-bubble{ max-width:82%; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="back-btn" aria-label="Back to home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </a>
  <h1 id="topbarTitle">Group Chat</h1>
</div>

<div class="app-body" id="appBody">
  <div class="center-msg" id="loadingMsg">Loading chat…</div>
</div>

<script>
  const API = 'https://api.tixtee.xyz/api';
  const COLORS = ['#e34b42','#47034E','#1e7a3d','#c9a227','#2f6fed','#8a4b90','#d9534f','#20c997','#e07a3f','#5c6ac4'];

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const appBody = document.getElementById('appBody');
  const topbarTitle = document.getElementById('topbarTitle');

  let eventInfo = null;
  let guest = null;
  let pollTimer = null;
  let lastCount = 0;

  function initials(name){
    if(!name) return '?';
    return name.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join('');
  }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function formatTime(iso){
    if(!iso) return '';
    return new Date(iso).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
  }
  function guestKey(){ return `tixtee_guest_${eventInfo.id}`; }

  async function init(){
    if(!slug){
      appBody.innerHTML = `<div class="center-msg">No chat specified. <a href="/">Go home</a></div>`;
      return;
    }
    try{
      const res = await fetch(`${API}/chat/slug/${encodeURIComponent(slug)}`);
      if(!res.ok){
        appBody.innerHTML = `<div class="center-msg">This chat link isn't active. <a href="/">Go home</a></div>`;
        return;
      }
      eventInfo = await res.json();
      topbarTitle.textContent = eventInfo.groupchat_name || eventInfo.title;

      const saved = localStorage.getItem(guestKey());
      if(saved){
        guest = JSON.parse(saved);
        renderChatScreen();
      } else {
        renderJoinScreen();
      }
    }catch(err){
      appBody.innerHTML = `<div class="center-msg">Could not reach the server. <a href="/">Go home</a></div>`;
    }
  }

  function renderJoinScreen(){
    const previewColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    appBody.innerHTML = `
      <div class="join-card">
        <div class="join-avatar" id="joinAvatar" style="background:${previewColor};">?</div>
        <h2>${escapeHtml(eventInfo.groupchat_name || eventInfo.title)}</h2>
        <p>Enter your name to join the chat.</p>
        <input type="text" id="joinNameInput" placeholder="Your name" maxlength="40">
        <div class="join-err" id="joinErr">Please enter a name.</div>
        <button type="button" class="join-btn" id="joinBtn">Join chat</button>
      </div>
    `;
    const nameInput = document.getElementById('joinNameInput');
    const avatarEl = document.getElementById('joinAvatar');
    nameInput.addEventListener('input', () => {
      avatarEl.textContent = initials(nameInput.value) || '?';
    });
    nameInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') doJoin(); });
    document.getElementById('joinBtn').addEventListener('click', doJoin);

    function doJoin(){
      const name = nameInput.value.trim();
      if(!name){
        document.getElementById('joinErr').style.display = 'block';
        return;
      }
      guest = { name, color: previewColor };
      localStorage.setItem(guestKey(), JSON.stringify(guest));
      renderChatScreen();
    }
  }

  function renderChatScreen(){
    appBody.innerHTML = `
      <div class="conversation-pane">
        <div class="conv-header">
          <div class="conv-header-avatar">${initials(eventInfo.groupchat_name || eventInfo.title)}</div>
          <div>
            <div class="conv-title">${escapeHtml(eventInfo.groupchat_name || eventInfo.title)}</div>
            <div class="conv-sub">Chatting as ${escapeHtml(guest.name)}</div>
          </div>
        </div>
        <div class="conv-messages" id="convMessages">
          <div class="conv-loading">Loading conversation…</div>
        </div>
        <div class="conv-composer">
          <input type="text" id="messageInput" placeholder="Type a message" maxlength="1000">
          <button type="button" class="send-btn" id="sendBtn" disabled aria-label="Send">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
          </button>
        </div>
      </div>
    `;

    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    messageInput.addEventListener('input', () => { sendBtn.disabled = !messageInput.value.trim(); });
    messageInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !sendBtn.disabled) sendMessage(); });
    sendBtn.addEventListener('click', sendMessage);

    loadMessages(true);
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => loadMessages(false), 4000);
  }

  async function loadMessages(showLoading){
    const msgEl = document.getElementById('convMessages');
    try{
      const res = await fetch(`${API}/chat/public/${eventInfo.id}/messages`);
      const messages = await res.json();
      if(messages.length === lastCount && !showLoading) return;
      lastCount = messages.length;

      if(!messages.length){
        msgEl.innerHTML = `<div class="conv-empty">No messages yet. Say hello 👋</div>`;
        return;
      }

      msgEl.innerHTML = messages.map(m => {
        const isMe = m.guest_name === guest.name && m.guest_color === guest.color;
        return `
          <div class="msg-row ${isMe ? 'out' : 'in'}">
            <div class="msg-bubble">
              ${isMe ? '' : `<div class="msg-sender">${escapeHtml(m.guest_name || 'Guest')}</div>`}
              ${escapeHtml(m.message)}
              <span class="msg-time">${formatTime(m.created_at)}</span>
            </div>
          </div>`;
      }).join('');
      msgEl.scrollTop = msgEl.scrollHeight;
    }catch(err){
      if(showLoading) msgEl.innerHTML = `<div class="conv-empty">Could not load messages.</div>`;
    }
  }

  async function sendMessage(){
    const input = document.getElementById('messageInput');
    const btn = document.getElementById('sendBtn');
    const text = input.value.trim();
    if(!text) return;
    btn.disabled = true;
    input.value = '';
    try{
      const res = await fetch(`${API}/chat/public/${eventInfo.id}/messages`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ message: text, guest_name: guest.name, guest_color: guest.color })
      });
      if(!res.ok) throw new Error();
      await loadMessages(false);
    }catch(err){
      input.value = text;
      alert('Could not send that message.');
    }
  }

  init();
</script>
</body>
</html>
