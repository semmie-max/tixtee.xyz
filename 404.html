<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Tixtee</title></head>
<body>
<script>
  var path = window.location.pathname;
  var eventMatch = path.match(/^\/e\/(.+)$/);
  var gcMatch = path.match(/^\/gc\/(.+)$/);
  var organiserMatch = path.match(/^\/organiser\/(.+)$/);

  if (eventMatch) {
    fetch('/e/index.html')
      .then(r => r.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      });
  } else if (gcMatch) {
    fetch('/gc/index.html')
      .then(r => r.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      });
  } else if (organiserMatch) {
    fetch('/organiser/index.html')
      .then(r => r.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      });
  } else {
    document.write('Page not found. <a href="/">Go home</a>');
  }
</script>
</body>
</html>
